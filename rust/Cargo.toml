[package]
name = "ark_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.11.1", features = ["anyhow"] }
anyhow = "1"
ark-bdk-wallet = { git = "https://github.com/arkade-os/rust-sdk.git", rev = "d8bc8a3" }
ark-core = { git = "https://github.com/arkade-os/rust-sdk.git", rev = "d8bc8a3" }
ark-client = { git = "https://github.com/arkade-os/rust-sdk.git", rev = "d8bc8a3", default-features = false, features = ["tls-webpki-roots", "sqlite"] }
bitcoin = { version = "0.32.7" }
esplora-client = { version = "0.11.0", features = ["async-https-native"] }
rand = "0.8.5"
openssl = { version = "0.10", features = ["vendored"] } 
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1.0.145"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
